<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSBKTV - 크리에이티브 유니버스</title>
  <meta name="description" content="압도적인 영상미와 서사가 공존하는 BSBKTV의 철학과 비전, 파트너 스토리.">
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* 기본 디자인 요소 */
    body { margin: 0; padding: 0; background-color: #0a0a0a; color: #e0e0e0; font-family: 'Pretendard', sans-serif; overflow-x: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: rgba(10, 10, 10, 0.95); position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 1000; border-bottom: 1px solid #222; }
    .logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 2px; }
    .hamburger-btn { background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; transition: color 0.3s; }
    .hamburger-btn:hover { color: #888; }
    
    /* 사이드 메뉴 */
    .side-menu { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background-color: #151515; box-shadow: -5px 0 15px rgba(0,0,0,0.8); z-index: 2000; transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 80px 30px 30px; box-sizing: border-box; }
    .side-menu.open { right: 0; }
    .close-btn { position: absolute; top: 20px; right: 30px; background: none; border: none; color: #fff; font-size: 40px; cursor: pointer; }
    .menu-list { list-style: none; padding: 0; margin: 0; }
    .menu-list li { margin-bottom: 25px; }
    .category-btn { background: none; border: none; color: #aaa; font-size: 18px; font-weight: 600; cursor: pointer; transition: color 0.3s; font-family: inherit; text-align: left; width: 100%; padding: 5px 0; border-bottom: 1px solid transparent; }
    .category-btn:hover, .category-btn.active { color: #fff; border-bottom: 1px solid #fff; }
    
    /* 메인 콘텐츠 캔버스 */
    .content-canvas { max-width: 800px; margin: 120px auto 50px auto; padding: 0 20px; min-height: 60vh; }
    
    /* 메시지 디자인 */
    .loading-msg { text-align: center; color: #888; font-size: 16px; margin-top: 50px; }
    .error-msg { text-align: center; color: #ff5555; font-size: 16px; margin-top: 50px; }

    /* 글 목록 (리스트) 디자인 */
    .styled-list { list-style: none; padding: 0; margin: 0; }
    .styled-list li { margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 20px; }
    .styled-list li:last-child { border-bottom: none; }
    .styled-list a { color: #fff; text-decoration: none; font-size: 18px; display: flex; align-items: flex-start; transition: color 0.3s; line-height: 1.5; }
    .styled-list a:hover { color: #888; }
    .styled-list .num { color: #666; margin-right: 15px; font-weight: bold; min-width: 25px; }
    .styled-list .title-text { flex: 1; word-break: keep-all; }

    /* 상세 보기 화면 디자인 */
    .back-btn { background: none; border: 1px solid #444; color: #ccc; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 15px; margin-bottom: 40px; transition: all 0.3s; }
    .back-btn:hover { background: #222; color: #fff; border-color: #888; }
    .post-item h2 { font-size: 28px; color: #fff; margin-bottom: 15px; border-left: 3px solid #fff; padding-left: 10px; margin-top: 0; }
    .post-item .date { font-size: 14px; color: #666; margin-bottom: 30px; }
    .post-item p { font-size: 16px; line-height: 1.8; color: #ccc; word-break: keep-all; white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo">BSBKTV</div>
    <button id="hamburger-btn" class="hamburger-btn">☰</button>
  </header>

  <nav id="side-menu" class="side-menu">
    <button id="close-btn" class="close-btn">&times;</button>
    <ul class="menu-list">
      <li><button class="category-btn active" data-category="intro">소개</button></li>
      <li><button class="category-btn" data-category="vision">비전</button></li>
      <li><button class="category-btn" data-category="partners">파트너</button></li>
      <li><button class="category-btn" data-category="writer">작가글(일현 조성훈)</button></li>
      <li><button class="category-btn" data-category="guide">이용안내</button></li>
      <li><button class="category-btn" data-category="secretmap">쉿 당신만 보세요</button></li>
    </ul>
  </nav>

  <main class="content-canvas">
    <div id="loading" class="loading-msg" style="display: none;">콘텐츠를 불러오는 중입니다...</div>
    <div id="message-container"></div>

    <div id="post-list-container" style="display: none;">
      <ul id="post-list" class="styled-list"></ul>
    </div>

    <div id="post-detail-container" style="display: none;">
      <button id="back-to-list-btn" class="back-btn">🔙 목록으로 돌아가기</button>
      <article id="dynamic-post-detail"></article>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. UI 로직
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const closeBtn = document.getElementById('close-btn');
      const sideMenu = document.getElementById('side-menu');
      const categoryBtns = document.querySelectorAll('.category-btn');
      const loadingDiv = document.getElementById('loading');
      const msgContainer = document.getElementById('message-container');
      const listContainer = document.getElementById('post-list-container');
      const detailContainer = document.getElementById('post-detail-container');

      if(hamburgerBtn) hamburgerBtn.addEventListener('click', () => sideMenu.classList.add('open'));
      if(closeBtn) closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));

      // 2. Supabase 연동 로직
      const SUPABASE_URL = 'https://dmjaxhydwaumhujrculd.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MTEyNTgsImV4cCI6MjA4MDI4NzI1OH0.nTdfW9Iw3OLyYbWcPGU2T8P_i-9tDeqUn1t2cAsIbn0';
      
      let supabase = null;
      let allPosts = []; // 불러온 데이터를 저장할 전역 배열

      try {
        if(SUPABASE_URL.includes('supabase.co')) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch(e) {
        console.error("Supabase 초기화 에러:", e);
      }

      // 카테고리 데이터 호출
      async function fetchCategoryPosts(category) {
        // 화면 초기화
        listContainer.style.display = 'none';
        detailContainer.style.display = 'none';
        msgContainer.innerHTML = ''; 
        if(loadingDiv) loadingDiv.style.display = 'block';

        if (!supabase) {
          if(loadingDiv) loadingDiv.style.display = 'none';
          msgContainer.innerHTML = '<div class="error-msg">Supabase 연결이 실패했습니다. 하지만 삼색 버튼(메뉴)은 정상적으로 열려야 합니다!</div>';
          return;
        }

        try {
          // 최신순 정렬 추가 (.order)
          const { data, error } = await supabase
            .from('bsbktv_seo_posts')
            .select('*')
            .eq('category', category)
            .order('created_at', { ascending: false });

          if (error) throw error;
          if(loadingDiv) loadingDiv.style.display = 'none';

          if (data && data.length > 0) {
            allPosts = data; // 데이터 저장
            renderList(); // 목록 그리기
          } else {
            msgContainer.innerHTML = '<div class="loading-msg">아직 등록된 글이 없습니다.</div>';
          }
        } catch (error) {
          console.error('데이터 로딩 오류:', error);
          if(loadingDiv) loadingDiv.style.display = 'none';
          msgContainer.innerHTML = '<div class="error-msg">데이터를 불러오는 중 오류가 발생했습니다.</div>';
        }
      }

      // 목록 렌더링 함수
      function renderList() {
        const listEl = document.getElementById('post-list');
        listEl.innerHTML = ''; 
        msgContainer.innerHTML = '';

        allPosts.forEach((post, index) => {
          const displayNum = allPosts.length - index; // 최신 글부터 높은 번호 부여
          const li = document.createElement('li');
          
          li.innerHTML = `
            <a href="javascript:void(0)" onclick="window.showDetail('${post.id}')">
              <span class="num">${displayNum}.</span>
              <span class="title-text">${post.title}</span>
            </a>
          `;
          listEl.appendChild(li);
        });

        listContainer.style.display = 'block';
        detailContainer.style.display = 'none';
      }

      // 전역 접근용 상세 보기 함수
      window.showDetail = function(postId) {
        const detailPostEl = document.getElementById('dynamic-post-detail');
        const targetPost = allPosts.find(p => String(p.id) === String(postId));
        
        if(!targetPost) return;

        const dateStr = new Date(targetPost.created_at).toLocaleDateString('ko-KR');
        
        detailPostEl.innerHTML = `
          <div class="post-item">
            <h2>${targetPost.title}</h2>
            <div class="date">${dateStr}</div>
            <p>${targetPost.content}</p>
          </div>
        `;

        listContainer.style.display = 'none';
        detailContainer.style.display = 'block';
        window.scrollTo(0, 0); // 화면 최상단으로 이동
      };

      // 뒤로가기 버튼 이벤트
      document.getElementById('back-to-list-btn').addEventListener('click', () => {
        renderList();
        window.scrollTo(0, 0);
      });

      // 카테고리 버튼 클릭 이벤트
      categoryBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          categoryBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const category = e.target.getAttribute('data-category');
          fetchCategoryPosts(category);
          
          if (window.innerWidth <= 768) {
            sideMenu.classList.remove('open');
          }
        });
      });

      // 사이트 접속 시 기본 로드
      fetchCategoryPosts('intro');
    });
  </script>
</body>
</html>
