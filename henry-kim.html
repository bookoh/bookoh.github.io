<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSBKTV | 헨리킴</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --gold: #C5A059; --dark: #000; --card-bg: #0A0A0A; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* 로딩 성능 최적화: 가벼운 레이아웃 */
        .hero-top { height: 35vh; background: linear-gradient(to bottom, transparent, #000), url('henry-kim-archive-hero.jpg') center/cover; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; }
        .main-name { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #111; border-radius: 12px; overflow: hidden; margin: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 버튼 바: 모바일에서도 터치하기 편하게 최적화 */
        .smart-nav { display: flex; gap: 8px; padding: 0 15px; margin-top: 20px; }
        .nav-btn { flex: 1; border: none; padding: 15px 5px; border-radius: 10px; font-weight: 800; color: #fff; cursor: pointer; font-size: 0.85rem; transition: transform 0.1s; }
        .nav-btn:active { transform: scale(0.95); } /* 터치 피드백 */
        .btn-join { background: #1B3C1A; } .btn-hall { background: #8E6B1D; } .btn-note { background: #1A304D; }

        .content-area { padding: 20px; min-height: 200px; opacity: 1; transition: opacity 0.2s; }
        .vvip-archive-card { background: #0A0A0A; border: 1px solid #222; padding: 25px; border-radius: 15px; border-left: 3px solid var(--gold); margin-bottom: 20px; }
        .archive-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--gold); margin-bottom: 10px; font-weight: 800; }
        .critique-box { border-top: 1px solid #222; margin-top: 15px; padding-top: 15px; color: #aaa; font-style: italic; font-size: 0.9rem; line-height: 1.6; }
    </style>
</head>
<body>

    <section class="hero-top">
        <h1 class="main-name">헨리킴</h1>
    </section>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/L7LNsCtG8f4" allowfullscreen loading="lazy"></iframe>
    </div>

    <nav class="smart-nav">
        <button class="nav-btn btn-join" onclick="showCategory('join')">가요제 참여</button>
        <button class="nav-btn btn-hall" onclick="showCategory('hall')">명예의 전당</button>
        <button class="nav-btn btn-note" onclick="showCategory('note')">프로듀서 노트</button>
    </nav>

    <div id="dynamic-content" class="content-area">데이터 로딩 중...</div>

    <script>
        // 마스터님의 실제 키 (오류 방지를 위해 가장 깔끔하게 정리)
        const _u = atob('aHR0cHM6Ly9kbWpheGh5ZHdhdW1odWpyY3VsZC5zdXBhYmFzZS5jbw==');
        const _k = atob('ZXlKaGJHY2lPaUpJVXoxTmlJc0luUjVjQ0k2SWtwWFZDSjkuZXlKcGMyTWlPaUp6ZFhCaFltRnpaU0lzSW1saGRDSTZNVEN4TXpNeU5USTVOems0T0RReE5pd2ljR0Y1YkdVeklqcGJJbU5zYVdWdWRHbDJaWEp6YUdWc2JDNWpiMjBpTENKcGMzTWlPaUp6ZFhCaFltRnpaU0o5Lm5UZGZXOUl3M09MeVliV2NQR1UyVDhQX2ktOXRkZXFVbjF0MmNBc0libjA=');
        
        let sb;
        const display = document.getElementById('dynamic-content');

        // [최적화] 즉시 실행하여 연결 확보
        try {
            sb = supabase.createClient(_u, _k);
        } catch(e) {
            display.innerHTML = "연결 오류: 페이지를 새로고침 해주세요.";
        }

        async function fetchHall() {
            try {
                const { data, error } = await sb.from('henry_hall_of_fame').select('*').order('id', { ascending: false });
                if (error) throw error;
                if (!data || data.length === 0) return '<p style="text-align:center; color:#555;">아카이브된 데이터가 없습니다.</p>';
                
                return data.map(item => `
                    <div class="vvip-archive-card">
                        <div class="archive-header"><span>${item.round} CHAMPION</span></div>
                        <h4 style="margin:0; color:var(--gold); font-size:1.3rem;">${item.artist}</h4>
                        <p style="margin:5px 0; color:#777; font-size:0.9rem;">${item.song || ''}</p>
                        <div class="critique-box">"${item.critique || '기록 준비 중'}"</div>
                    </div>`).join('');
            } catch (e) {
                return '<p style="text-align:center; color:red;">데이터를 가져오지 못했습니다. RLS 설정을 확인하세요.</p>';
            }
        }

        async function showCategory(type) {
            display.style.opacity = 0.5; // 즉각적인 반응을 위해 살짝 흐리게만 처리
            
            if (type === 'hall') {
                display.innerHTML = await fetchHall();
            } else if (type === 'join') {
                display.innerHTML = '<div style="text-align:center; padding:40px;"><p>스레드 가요제 공식 계정에서 참여하세요.</p><a href="https://www.threads.net/@henrykim_story" target="_blank" style="color:var(--gold); font-weight:bold; text-decoration:none;">@henrykim_story 바로가기</a></div>';
            } else if (type === 'note') {
                display.innerHTML = '<div style="line-height:1.8; color:#ccc; padding:10px;">우리는 1분이라는 찰나를 영원으로 박제합니다.</div>';
            }
            
            display.style.opacity = 1;
        }

        // 초기 화면 설정
        window.onload = () => showCategory('hall');
    </script>
</body>
</html>
