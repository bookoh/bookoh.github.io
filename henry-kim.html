<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSBKTV | 헨리킴</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; -webkit-font-smoothing: antialiased; }
        .hero { height: 35vh; background: linear-gradient(to bottom, transparent, #000), url('henry-kim-archive-hero.jpg') center/cover; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; }
        .video-box { padding: 15px; }
        .v-container { position: relative; padding-bottom: 56.25%; height: 0; background: #111; border-radius: 12px; overflow: hidden; }
        .v-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .nav { display: flex; gap: 8px; padding: 15px; }
        .btn { flex: 1; border: none; padding: 18px 5px; border-radius: 12px; font-weight: 800; color: #fff; font-size: 0.85rem; }
        .btn-hall { background: #8E6B1D; } .btn-join { background: #1B3C1A; } .btn-note { background: #1A304D; }
        .content { padding: 0 15px 50px; }
        .card { background: #0A0A0A; border: 1px solid #222; padding: 20px; border-radius: 15px; border-left: 4px solid #C5A059; margin-bottom: 15px; }
        .c-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: #C5A059; margin-bottom: 8px; font-weight: 800; }
    </style>
</head>
<body>
    <div class="hero"><h1>헨리킴</h1></div>
    <div class="video-box"><div class="v-container"><iframe src="https://www.youtube.com/embed/L7LNsCtG8f4"></iframe></div></div>
    <div class="nav">
        <button class="btn btn-join" onclick="go('join')">참여</button>
        <button class="btn btn-hall" onclick="go('hall')">명예의 전당</button>
        <button class="btn btn-note" onclick="go('note')">노트</button>
    </div>
    <div id="out" class="content"></div>

    <script>
        // 마스터님, atob 오타를 완전히 박멸했습니다.
        const _u = atob('aHR0cHM6Ly9kbWpheGh5ZHdhdW1odWpyY3VsZC5zdXBhYmFzZS5jbw==');
        const _k = atob('ZXlKaGJHY2lPaUpJVXoxTmlJc0luUjVjQ0k2SWtwWFZDSjkuZXlKcGMyTWlPaUp6ZFhCaFltRnpaU0lzSW1saGRDSTZNVEN4TXpNeU5USTVOems0T0RReE5pd2ljR0Y1YkdVeklqcGJJbU5zYVdWdWRHbDJaWEp6YUdWc2JDNWpiMjBpTENKcGMzTWlPaUp6ZFhCaFltRnpaU0o5Lm5UZGZXOUl3M09MeVliV2NQR1UyVDhQX2ktOXRkZXFVbjF0MmNBc0libjA=');
        const sb = supabase.createClient(_u, _k);
        const out = document.getElementById('out');

        async function go(type) {
            out.innerHTML = '<p style="text-align:center;">로딩 중...</p>';
            if (type === 'hall') {
                const { data, error } = await sb.from('henry_hall_of_fame').select('*').order('id', { ascending: false });
                if (error || !data) { out.innerHTML = '권한 에러. SQL을 다시 실행하세요.'; return; }
                out.innerHTML = data.map(i => `
                    <div class="card">
                        <div class="c-header"><span>${i.round}</span></div>
                        <h4 style="margin:0;color:#C5A059;">${i.artist}</h4>
                        <p style="margin:5px 0;font-size:0.85rem;color:#777;">${i.song || ''}</p>
                        <div style="border-top:1px solid #222;margin-top:10px;padding-top:10px;font-size:0.85rem;color:#aaa;font-style:italic;">"${i.critique || '기록 중'}"</div>
                    </div>`).join('');
            } else {
                out.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">준비 중인 섹션입니다.</div>';
            }
        }
        window.onload = () => go('hall');
    </script>
</body>
</html>
