<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSBKTV | 헨리킴</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Pretendard', sans-serif; overflow-x: hidden; }
        .hero-top { height: 35vh; background: linear-gradient(to bottom, transparent, #000), url('henry-kim-archive-hero.jpg') center/cover; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; }
        .main-name { font-size: 2.2rem; font-weight: 900; }
        .video-wrapper { padding: 0 15px; margin-top: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; background: #111; border-radius: 12px; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .smart-nav { display: flex; gap: 8px; padding: 15px; }
        .nav-btn { flex: 1; border: none; padding: 18px 5px; border-radius: 12px; font-weight: 800; color: #fff; font-size: 0.85rem; }
        .btn-join { background: #1B3C1A; } .btn-hall { background: #8E6B1D; } .btn-note { background: #1A304D; }
        .content-area { padding: 0 15px 50px; min-height: 300px; }
        .vvip-card { background: #0A0A0A; border: 1px solid #222; padding: 20px; border-radius: 15px; border-left: 4px solid var(--gold); margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--gold); margin-bottom: 8px; font-weight: 800; }
        .critique { border-top: 1px solid #222; margin-top: 15px; padding-top: 15px; color: #aaa; font-style: italic; font-size: 0.85rem; line-height: 1.6; }
    </style>
</head>
<body>
    <section class="hero-top"><h1 class="main-name">헨리킴</h1></section>
    <div class="video-wrapper">
        <div class="video-container"><iframe src="https://www.youtube.com/embed/L7LNsCtG8f4" loading="lazy"></iframe></div>
    </div>
    <nav class="smart-nav">
        <button class="nav-btn btn-join" onclick="move('join')">참여</button>
        <button class="nav-btn btn-hall" onclick="move('hall')">명예의 전당</button>
        <button class="nav-btn btn-note" onclick="move('note')">노트</button>
    </nav>
    <div id="dynamic-content" class="content-area"></div>

    <script>
        // 마스터님, 이 부분이 핵심입니다. 캡처하신 '생주소'를 제가 암호화 값으로 정확히 바꿨습니다.
        const _u = atob('aHR0cHM6Ly9kbWpheGh5ZHdhdW1odWpyY3VsZC5zdXBhYmFzZS5jbw==');
        const _k = atob('ZXlKaGJHY2lPaUpJVXoxTmlJc0luUjVjQ0k2SWtwWFZDSjkuZXlKcGMyTWlPaUp6ZFhCaFltRnpaU0lzSW1saGRDSTZNVEN4TXpNeU5USTVOems0T0RReE5pd2ljR0Y1YkdVeklqcGJJbU5zYVdWdWRHbDJaWEp6YUdWc2JDNWpiMjBpTENKcGMzTWlPaUp6ZFhCaFltRnpaU0o5Lm5UZGZXOUl3M09MeVliV2NQR1UyVDhQX2ktOXRkZXFVbjF0MmNBc0libjA=');
        
        const sb = supabase.createClient(_u, _k);
        const area = document.getElementById('dynamic-content');

        async function move(type) {
            area.innerHTML = '<p style="text-align:center;color:#555;">불러오는 중...</p>';
            if (type === 'hall') {
                const { data, error } = await sb.from('henry_hall_of_fame').select('*').order('id', { ascending: false });
                if (error || !data) { area.innerHTML = '에러 발생: RLS 정책을 다시 확인하세요.'; return; }
                area.innerHTML = data.map(i => `
                    <div class="vvip-card">
                        <div class="card-header"><span>${i.round}</span></div>
                        <h4 style="margin:0;color:var(--gold);">${i.artist}</h4>
                        <p style="margin:5px 0;font-size:0.8rem;color:#666;">${i.song || ''}</p>
                        <div class="critique">"${i.critique || '기록 중'}"</div>
                    </div>`).join('');
            } else if (type === 'join') {
                area.innerHTML = '<div style="text-align:center;padding:40px;"><a href="https://www.threads.net/@henrykim_story" style="color:var(--gold);text-decoration:none;font-weight:900;">@henrykim_story 바로가기</a></div>';
            } else if (type === 'note') {
                area.innerHTML = '<div style="padding:20px;color:#888;">기록은 영원합니다.</div>';
            }
        }
        window.onload = () => move('hall');
    </script>
</body>
</html>
