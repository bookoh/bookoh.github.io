<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSBKTV 실시간 상황실 V6.5.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #0f0; --bg: #000; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; padding: 20px; }
        .header { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; }
        .card { border: 1px solid var(--neon); padding: 15px; margin-bottom: 10px; background: rgba(0,255,0,0.05); border-radius: 5px; }
        .score { float: right; color: #ff0; font-weight: bold; }
        .status { background: #333; color: #fff; padding: 2px 6px; font-size: 0.8em; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>[ BSBKTV LIVE TRENDS ]</h1>
        <p>STATUS: <span id="st" style="color: #0ff;">CONNECTING...</span></p>
    </div>
    <div id="box">데이터 로딩 중...</div>

    <script>
        const URL = 'https://dmjaxhydwaumhujrculd.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MTEyNTgsImV4cCI6MjA4MDI4NzI1OH0.nTdfW9Iw3OLyYbWcPGU2T8P_i-9tDeqUn1t2cAsIbn0';
        const sb = supabase.createClient(URL, KEY);

        async function refresh() {
            const { data, error } = await sb.from('trending_keywords').select('*').order('created_at', { ascending: false }).limit(10);
            if (data) {
                document.getElementById('box').innerHTML = data.map(v => `
                    <div class="card">
                        <span class="score">VIRAL: ${v.viral_score}</span>
                        <span class="status">${v.status}</span>
                        <div style="font-size: 1.1em; margin-top: 10px;">> ${v.keyword}</div>
                    </div>
                `).join('');
                document.getElementById('st').innerText = 'ONLINE';
            }
        }
        refresh();
        setInterval(refresh, 60000);
    </script>
</body>
</html>
