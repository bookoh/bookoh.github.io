<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK RADAR – YT COMPLETE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#0a0a0a; color:white; font-family:sans-serif; }
.spinner {
  width:20px;height:20px;border:3px solid rgba(255,255,255,0.2);
  border-top:3px solid #ffcc00;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg);} }
</style>
</head>
<body class="min-h-screen p-6">

<div class="max-w-6xl mx-auto space-y-6">

<h1 class="text-3xl font-bold text-yellow-400">
BLACK RADAR – YouTube Intent Complete
</h1>

<div class="flex gap-4">
<input id="seed" class="flex-1 p-4 rounded bg-black border border-zinc-700"
placeholder="Enter seed keyword...">
<button onclick="launchScan()" class="bg-yellow-400 text-black px-6 rounded font-bold">
SCAN
</button>
</div>

<div id="status" class="text-yellow-400 font-mono"></div>

<div class="overflow-auto max-h-[650px] border border-zinc-800 rounded">
<table class="w-full text-sm">
<thead class="bg-black sticky top-0">
<tr class="text-left text-zinc-400">
<th class="p-3">#</th>
<th class="p-3">Keyword</th>
<th class="p-3">Score</th>
<th class="p-3">Video Title</th>
<th class="p-3">Shorts Title</th>
<th class="p-3">Copy</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>
</div>

</div>

<script>

const delay = ms => new Promise(r => setTimeout(r, ms));

async function launchScan() {
    const seed = document.getElementById('seed').value.trim();
    if (!seed) return;

    const status = document.getElementById('status');
    status.innerHTML = '<div class="spinner inline-block mr-2"></div>Scanning...';

    const keywords = await fullExpansion(seed);
    const ranked = rankKeywords(keywords);
    renderResults(ranked);

    status.textContent = `Completed. ${ranked.length} high-intent keywords captured.`;
}

async function fetchSuggest(query, lang="en") {
    const url = `https://suggestqueries.google.com/complete/search?client=youtube&hl=${lang}&q=${encodeURIComponent(query)}`;
    try {
        const res = await fetch(url);
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data[1]) ? data[1] : [];
    } catch { return []; }
}

async function fullExpansion(seed) {

    const collected = new Set();

    const prefixes = [
        `how to ${seed}`,
        `best ${seed}`,
        `${seed} tutorial`,
        `${seed} review`,
        `${seed} vs`,
        `${seed} 2026`,
        `${seed} 방법`,
        `${seed} 추천`,
        `${seed} 리뷰`
    ];

    // 기본
    (await fetchSuggest(seed,"en")).forEach(k=>collected.add(k));
    (await fetchSuggest(seed,"ko")).forEach(k=>collected.add(k));
    await delay(120);

    // a~z
    for (let c of "abcdefghijklmnopqrstuvwxyz") {
        (await fetchSuggest(`${seed} ${c}`,"en")).forEach(k=>collected.add(k));
        await delay(100);
    }

    // 숫자
    for (let n=1;n<=5;n++){
        (await fetchSuggest(`${seed} ${n}`,"en")).forEach(k=>collected.add(k));
        await delay(100);
    }

    // 접두어
    for (let p of prefixes){
        (await fetchSuggest(p,"en")).forEach(k=>collected.add(k));
        await delay(120);
    }

    return Array.from(collected).slice(0,80);
}

function rankKeywords(list){
    return list.map(k=>{
        let score = 50;

        if(k.includes("2026")) score+=15;
        if(k.includes("how") || k.includes("방법")) score+=10;
        if(k.includes("best") || k.includes("추천")) score+=10;
        if(k.includes("review") || k.includes("리뷰")) score+=8;
        if(k.split(" ").length>=4) score+=12; // 롱테일 가중

        return { keyword:k, score };
    })
    .sort((a,b)=>b.score-a.score)
    .slice(0,50);
}

function generateVideoTitle(keyword){
    const templates = [
        `${keyword} – Complete Guide`,
        `The Truth About ${keyword}`,
        `${keyword} Explained Clearly`,
        `${keyword} Strategy Breakdown`,
        `${keyword} (2026 Updated)`
    ];
    return templates[Math.floor(Math.random()*templates.length)];
}

function generateShortTitle(keyword){
    const templates = [
        `${keyword} 핵심 1분 정리`,
        `${keyword} 이건 몰랐지?`,
        `${keyword} 지금 바로 확인`,
        `${keyword} 30초 요약`,
        `${keyword} 충격 결과`
    ];
    return templates[Math.floor(Math.random()*templates.length)];
}

function renderResults(data){
    const tbody = document.getElementById('results');

    tbody.innerHTML = data.map((item,i)=>`
        <tr class="border-b border-zinc-800 hover:bg-zinc-900">
            <td class="p-3 text-yellow-400">${i+1}</td>
            <td class="p-3">${item.keyword}</td>
            <td class="p-3 text-green-400 font-bold">${item.score}</td>
            <td class="p-3">${generateVideoTitle(item.keyword)}</td>
            <td class="p-3">${generateShortTitle(item.keyword)}</td>
            <td class="p-3">
                <button onclick="navigator.clipboard.writeText('${item.keyword}')"
                class="bg-zinc-800 px-3 py-1 rounded hover:bg-yellow-400 hover:text-black">
                COPY
                </button>
            </td>
        </tr>
    `).join('');
}

</script>
</body>
</html>
