<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSBKTV BLACK RADAR v6.6.7</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --p: #ffcc00; --bg: #050505; }
        /* [V6.6.7 FIX] 화면 전체를 기기 높이에 강제 고정 */
        html, body { 
            height: 100dvh; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000;
            color: #fff;
            position: fixed; 
            width: 100%;
        }
        .glass { 
            background: rgba(20,20,20,0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,204,0,0.1);
        }
        /* 내부 리스트만 스크롤 가능하게 제한 */
        .scroll-v { 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,204,0,0.1); border-top: 3px solid var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col p-3 box-border">
    
    <div id="gate" class="fixed inset-0 bg-black z-[9999] flex items-center justify-center">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-sm text-center mx-4">
            <h1 class="text-3xl font-black mb-6 text-yellow-400">RADAR v6.6.7</h1>
            <input type="password" id="m-key" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center mb-4 outline-none focus:border-yellow-400" placeholder="MASTER KEY">
            <div id="cfg" class="hidden space-y-3 mb-6">
                <input id="s-url" class="w-full bg-black border border-zinc-700 p-3 rounded-xl text-[10px] font-mono" placeholder="SUPABASE_URL">
                <input id="s-key" type="password" class="w-full bg-black border border-zinc-700 p-3 rounded-xl text-[10px] font-mono" placeholder="SUPABASE_ANON_KEY">
            </div>
            <button onclick="boot()" class="w-full bg-yellow-400 text-black font-black py-5 rounded-2xl active:scale-95 transition-all">INITIALIZE</button>
        </div>
    </div>

    <div id="console" class="hidden h-full flex flex-col gap-3">
        <header class="glass p-4 rounded-2xl flex justify-between items-center h-[60px] shrink-0">
            <div class="font-black text-xl tracking-tighter">BSBKTV <span class="text-yellow-400">BLACK</span></div>
            <div id="db-st" class="text-[10px] font-mono text-zinc-600 uppercase">STANDBY</div>
        </header>

        <div class="glass p-4 rounded-2xl shrink-0">
            <div class="flex gap-2">
                <input id="kw" class="flex-1 bg-black border border-zinc-800 p-4 rounded-xl text-lg outline-none focus:border-yellow-400" placeholder="GLOBAL SEED..." onkeypress="if(event.key==='Enter') scan()">
                <button id="scan-btn" onclick="scan()" class="bg-yellow-400 text-black font-black px-6 rounded-xl active:scale-95">SCAN</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col gap-3 min-h-0">
            <div class="flex-[1.5] glass rounded-3xl p-5 flex flex-col min-h-0">
                <h3 class="text-xs font-bold mb-3 text-zinc-500">🎯 LIVE INTENTS <span id="cnt" class="text-yellow-400">0</span></h3>
                <div class="flex-1 scroll-v">
                    <table class="w-full text-left text-xs">
                        <tbody id="res-body">
                            <tr><td class="py-20 text-center text-zinc-800 font-mono">AWAITING SCAN...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex-1 glass rounded-3xl p-5 flex flex-col shrink-0 min-h-[220px]">
                <h3 class="text-xs font-bold mb-3 text-zinc-500">📈 MARKET TREND</h3>
                <div class="flex-1 relative">
                    <canvas id="chart"></canvas>
                </div>
                <div class="mt-4 pt-3 border-t border-zinc-800 text-[9px] text-zinc-600 font-mono flex justify-between">
                    <span>V6.5.1 ENGINE</span>
                    <span>SYNCED: <span id="sync-cnt">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let sb = null, ch = null, booted = false;

        function boot() {
            const p = document.getElementById('m-key').value;
            if (p === "6666" && !booted) {
                document.getElementById('cfg').classList.remove('hidden');
                booted = true; return;
            }
            const u = document.getElementById('s-url').value, k = document.getElementById('s-key').value;
            if (u && k) {
                try {
                    sb = supabase.createClient(u, k);
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('console').classList.remove('hidden');
                    document.getElementById('db-st').innerText = 'CONNECTED';
                    document.getElementById('db-st').style.color = '#4ade80';
                } catch (e) { alert("INIT ERROR"); }
            }
        }

        // [V6.6.7 FIX] 프록시 없이 작동하는 JSONP 하이재킹 엔진
        async function scan() {
            const seed = document.getElementById('kw').value.trim();
            if (!seed) return;
            const btn = document.getElementById('scan-btn');
            btn.innerHTML = '<div class="spinner mx-auto"></div>';
            btn.disabled = true;

            // JSONP 콜백 정의
            window.googleCallback = async function(data) {
                const suggestions = data[1];
                if (suggestions && suggestions.length > 0) {
                    const processed = suggestions.slice(0, 15).map((it, i) => ({
                        seed_keyword: seed, intent_keyword: it,
                        money_score: Math.max(82, 98 - (i * 2.5) - (Math.random() * 2)),
                        created_at: new Date().toISOString()
                    }));
                    render(processed);
                    if (sb) await sb.from('intent_assets').insert(processed);
                    document.getElementById('sync-cnt').innerText = processed.length;
                }
                cleanupScan();
            };

            const script = document.createElement('script');
            script.id = 'jsonp-script';
            script.src = `https://suggestqueries.google.com/complete/search?client=youtube&hl=ko&q=${encodeURIComponent(seed)}&callback=googleCallback`;
            
            // 타임아웃 처리
            const timeout = setTimeout(() => {
                if (document.getElementById('jsonp-script')) {
                    cleanupScan();
                    alert("SCAN FAILED: NETWORK DELAY. RETRYING...");
                }
            }, 5000);

            function cleanupScan() {
                clearTimeout(timeout);
                const s = document.getElementById('jsonp-script');
                if (s) s.remove();
                btn.innerHTML = 'SCAN';
                btn.disabled = false;
            }

            document.body.appendChild(script);
        }

        function render(data) {
            const tbody = document.getElementById('res-body');
            tbody.innerHTML = data.map((d, i) => `
                <tr class="border-b border-zinc-900/50">
                    <td class="py-4 font-bold text-yellow-500 w-8">0${i+1}</td>
                    <td class="py-4 text-zinc-200">${d.intent_keyword}</td>
                    <td class="py-4 text-right font-mono text-cyan-500">${d.money_score.toFixed(1)}%</td>
                </tr>
            `).join('');
            document.getElementById('cnt').innerText = data.length;
            updateChart(data);
        }

        function updateChart(data) {
            const ctx = document.getElementById('chart').getContext('2d');
            if (ch) ch.destroy();
            ch = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.slice(0, 5).map(d => d.intent_keyword.substring(0,6)),
                    datasets: [{ data: data.slice(0, 5).map(d => d.money_score), backgroundColor: '#ffcc00' }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false, min: 70 }, 
                        x: { grid: { display: false }, ticks: { color: '#444', font: { size: 9 } } } 
                    }
                }
            });
        }
    </script>
</body>
</html>
