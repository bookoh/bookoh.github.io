<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK RADAR – BSBKTV SPECIAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { background:#0a0a0a; color:white; font-family: 'Pretendard', sans-serif; }
    .spinner {
        width:24px;height:24px;border:3px solid rgba(255,204,0,0.1);
        border-top:3px solid #ffcc00;border-radius:50%;
        animation:spin .6s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg);} }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
</style>
</head>
<body class="min-h-screen p-6">

<div class="max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-end border-b border-zinc-800 pb-6">
        <div>
            <h1 class="text-5xl font-black text-yellow-400 tracking-tighter italic">BLACK RADAR</h1>
            <p class="text-zinc-500 text-xs font-mono mt-2 uppercase tracking-widest">High-Speed Intent Intelligence / BSBKTV V2.5</p>
        </div>
        <div id="status" class="text-yellow-400 font-mono text-sm mb-1 uppercase">Ready to scan</div>
    </div>

    <div class="grid grid-cols-12 gap-4 p-4 bg-zinc-900/50 rounded-xl border border-zinc-800 shadow-2xl">
        <input id="seed" class="col-span-10 p-4 rounded-lg bg-black border border-zinc-700 text-yellow-100 text-lg focus:outline-none focus:border-yellow-400 transition-all placeholder-zinc-700"
        placeholder="분석할 키워드를 입력하세요 (예: 부산 맛집, 아이폰17 등)">
        <button onclick="launchScan()" class="col-span-2 bg-yellow-400 text-black rounded-lg font-black text-lg hover:bg-yellow-300 transition-all hover:scale-[1.02] active:scale-95 shadow-[0_0_20px_rgba(255,204,0,0.2)]">
        SCAN
        </button>
    </div>

    <div class="border border-zinc-800 rounded-xl bg-black overflow-hidden shadow-inner">
        <div class="overflow-auto max-h-[750px]">
            <table class="w-full text-sm text-left border-collapse">
                <thead class="bg-zinc-900 text-zinc-500 sticky top-0 z-20 shadow-md">
                    <tr>
                        <th class="p-4 w-16 text-center">#</th>
                        <th class="p-4">High-Intent Keyword</th>
                        <th class="p-4 w-24 text-center">Score</th>
                        <th class="p-4">Automated Title Strategy</th>
                        <th class="p-4 w-28 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="results" class="divide-y divide-zinc-900">
                    <tr>
                        <td colspan="5" class="p-32 text-center text-zinc-700 font-mono italic">Waiting for seed input...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// 1. 핵심 유틸리티
const delay = ms => new Promise(r => setTimeout(r, ms));

// 2. 고속 데이터 추출 엔진 (CORS Proxy + Parallel)
async function fetchSuggest(query, lang="ko") {
    const targetUrl = `https://suggestqueries.google.com/complete/search?client=youtube&hl=${lang}&q=${encodeURIComponent(query)}`;
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
    
    try {
        const res = await fetch(proxyUrl);
        if (!res.ok) return [];
        const json = await res.json();
        const data = JSON.parse(json.contents);
        return Array.isArray(data[1]) ? data[1] : [];
    } catch { return []; }
}

async function launchScan() {
    const seed = document.getElementById('seed').value.trim();
    if (!seed) return;

    const status = document.getElementById('status');
    const tbody = document.getElementById('results');
    
    status.innerHTML = '<div class="spinner inline-block mr-3 align-middle"></div><span class="status-pulse text-white">Engines Warming Up...</span>';
    tbody.innerHTML = `<tr><td colspan="5" class="p-32 text-center text-zinc-700 font-mono">유튜브 인텐트 네트워크를 병렬 스캔 중입니다...</td></tr>`;

    try {
        const collected = new Set();
        const start = Date.now();

        // [병렬 실행] 봇들을 한꺼번에 출동시킵니다.
        const tasks = [
            fetchSuggest(seed, "ko"),
            fetchSuggest(seed, "en"),
            fetchSuggest(`how to ${seed}`, "en"),
            fetchSuggest(`best ${seed}`, "en"),
            fetchSuggest(`${seed} 추천`, "ko"),
            fetchSuggest(`${seed} 리뷰`, "ko"),
            fetchSuggest(`${seed} 2026`, "ko"),
            ...["a","b","c","d","e"].map(c => fetchSuggest(`${seed} ${c}`, "en"))
        ];

        const allRawResults = await Promise.all(tasks);
        allRawResults.flat().forEach(k => collected.add(k));

        const ranked = rankKeywords(Array.from(collected));
        const elapsed = ((Date.now() - start) / 1000).toFixed(1);

        if (ranked.length === 0) {
            status.textContent = "SCAN FAILED. TRY RE-SCAN.";
            return;
        }

        renderResults(ranked);
        status.textContent = `Completed in ${elapsed}s / ${ranked.length} Targets Captured.`;
    } catch (err) {
        status.textContent = "SYSTEM ERROR.";
    }
}

function rankKeywords(list) {
    return list.map(k => {
        let score = 30;
        const year = "2026";
        
        if (k.includes(year)) score += 25; // 최신 가중치 강화
        if (k.includes("방법") || k.includes("how")) score += 15;
        if (k.includes("추천") || k.includes("best")) score += 12;
        if (k.includes("리뷰") || k.includes("review")) score += 10;
        if (k.split(" ").length >= 4) score += 15; // 롱테일 인텐트 가점

        return { keyword: k, score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 50);
}

function renderResults(data) {
    const tbody = document.getElementById('results');
    tbody.innerHTML = data.map((item, i) => {
        const title = `[2026] ${item.keyword} – 이 영상 하나로 종결 (진짜 정답)`;
        return `
        <tr class="group hover:bg-zinc-900/80 transition-all border-b border-zinc-900">
            <td class="p-4 text-center font-mono text-zinc-600">${i + 1}</td>
            <td class="p-4 font-bold text-yellow-100 text-base">${item.keyword}</td>
            <td class="p-4 text-center">
                <span class="px-3 py-1 rounded-full bg-yellow-400/10 text-yellow-400 font-black border border-yellow-400/20">${item.score}</span>
            </td>
            <td class="p-4">
                <div class="text-zinc-300 font-semibold mb-1">🎬 ${title}</div>
                <div class="text-zinc-500 text-xs italic opacity-0 group-hover:opacity-100 transition-all">#${item.keyword.replace(/\s/g, '')} #Shorts #2026</div>
            </td>
            <td class="p-4 text-center">
                <button onclick="copyText('${item.keyword}')"
                class="bg-zinc-800 text-zinc-400 px-4 py-2 rounded font-black text-xs hover:bg-yellow-400 hover:text-black transition-all active:scale-90">
                COPY
                </button>
            </td>
        </tr>
    `}).join('');
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        btn.textContent = 'DONE';
        setTimeout(() => btn.textContent = 'COPY', 800);
    });
}
</script>
</body>
</html>
