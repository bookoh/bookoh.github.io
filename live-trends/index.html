<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noodp, noydir">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSBKTV BLACK RADAR v6.6.6</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --p: #ffcc00; --bg: #050505; }
        
        /* [LAYOUT LOCK] 모바일 무한 스크롤 및 레이아웃 붕괴 방지 */
        html, body { 
            height: 100dvh; /* 모바일 가시 영역 고정 */
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000;
            color: #fff;
            position: fixed; 
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        .glass { 
            background: rgba(20,20,20,0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,204,0,0.1);
        }

        /* [SCROLL CONTROL] 내부 독립 스크롤 영역 */
        .scroll-v { 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none;
        }
        .scroll-v::-webkit-scrollbar { display: none; }
        
        /* 로딩 애니메이션 */
        .spinner { 
            width: 24px; height: 24px; 
            border: 3px solid rgba(255,204,0,0.2); 
            border-top: 3px solid var(--p); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 차트 캔버스 크기 고정 */
        #chart-container { position: relative; height: 100%; width: 100%; }
    </style>
</head>
<body class="flex flex-col p-3 box-border">
    
    <div id="gate" class="fixed inset-0 bg-black z-[9999] flex items-center justify-center">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-sm text-center mx-4 glow">
            <h1 class="text-3xl font-black mb-6 text-yellow-400 tracking-tighter">RADAR v6.6.6</h1>
            <input type="password" id="m-key" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-center mb-4 outline-none focus:border-yellow-400 text-white" placeholder="MASTER KEY">
            
            <div id="cfg" class="hidden space-y-3 mb-6 transition-all">
                <p class="text-[10px] text-zinc-500 font-mono uppercase tracking-widest">Supabase Config</p>
                <input id="s-url" class="w-full bg-black border border-zinc-700 p-3 rounded-xl text-[10px] font-mono text-white" placeholder="SUPABASE_URL">
                <input id="s-key" type="password" class="w-full bg-black border border-zinc-700 p-3 rounded-xl text-[10px] font-mono text-white" placeholder="SUPABASE_ANON_KEY">
            </div>

            <button onclick="boot()" class="w-full bg-yellow-400 text-black font-black py-5 rounded-2xl active:scale-95 transition-all shadow-lg shadow-yellow-400/20">
                INITIALIZE SYSTEM
            </button>
        </div>
    </div>

    <div id="console" class="hidden h-full flex flex-col gap-3 overflow-hidden">
        
        <header class="glass p-4 rounded-2xl flex justify-between items-center h-[70px] shrink-0">
            <div class="font-black text-xl tracking-tighter">BSBKTV <span class="text-yellow-400">BLACK</span></div>
            <div id="db-st" class="text-[10px] font-mono text-zinc-600 tracking-widest uppercase">STANDBY</div>
        </header>

        <div class="glass p-4 rounded-2xl shrink-0">
            <div class="flex gap-2">
                <input id="kw" class="flex-1 bg-black border border-zinc-800 p-4 rounded-xl text-lg text-white outline-none focus:border-yellow-400 transition-all" 
                       placeholder="SCAN GLOBAL SEED..." onkeypress="if(event.key==='Enter') scan()">
                <button id="scan-btn" onclick="scan()" class="bg-yellow-400 text-black font-black px-8 rounded-xl active:scale-95 transition-all">
                    SCAN
                </button>
            </div>
        </div>

        <div class="flex-1 flex flex-col md:flex-row gap-3 min-h-0 overflow-hidden">
            
            <div class="flex-[1.5] glass rounded-3xl p-5 flex flex-col min-h-0 overflow-hidden">
                <h3 class="text-xs font-bold mb-4 text-zinc-500 uppercase tracking-widest">
                    🎯 LIVE INTENTS <span id="cnt" class="text-yellow-400 ml-2 font-mono">0</span>
                </h3>
                <div class="flex-1 scroll-v">
                    <table class="w-full text-left text-xs border-separate border-spacing-y-2">
                        <tbody id="res-body">
                            <tr>
                                <td class="py-20 text-center text-zinc-800 font-mono uppercase tracking-widest text-sm">
                                    System Secure. Waiting for Command.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex-1 glass rounded-3xl p-5 flex flex-col shrink-0 min-h-[260px] md:min-h-0 overflow-hidden">
                <h3 class="text-xs font-bold mb-4 text-zinc-500 uppercase tracking-widest">📈 MARKET INTENSITY</h3>
                <div class="flex-1" id="chart-container">
                    <canvas id="chart"></canvas>
                </div>
                <div class="mt-4 pt-4 border-t border-zinc-800 text-[9px] text-zinc-600 font-mono flex justify-between items-center">
                    <span>V6.5.1 PHYSICAL ENGINE</span>
                    <span class="bg-zinc-900 px-2 py-1 rounded">SYNCED: <span id="sync-cnt" class="text-zinc-400">0</span></span>
                </div>
            </div>

        </div>
    </div>

    <script>
        let sb = null, ch = null, booted = false;
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];

        // [SYSTEM BOOT] 보안 인증 및 슈파베이스 초기화
        function boot() {
            const p = document.getElementById('m-key').value;
            if (p === "6666" && !booted) {
                document.getElementById('cfg').classList.remove('hidden');
                booted = true; 
                return;
            }
            
            const u = document.getElementById('s-url').value;
            const k = document.getElementById('s-key').value;
            
            if (u && k) {
                try {
                    sb = supabase.createClient(u, k);
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('console').classList.remove('hidden');
                    const status = document.getElementById('db-st');
                    status.innerText = 'CONNECTED';
                    status.style.color = '#4ade80';
                } catch (e) { 
                    alert("INITIALIZATION FAILED: CHECK YOUR SECRETS."); 
                }
            } else {
                alert("REQUIRED: SUPABASE URL AND KEY.");
            }
        }

        // [SCAN ENGINE] 3중 프록시 기반 데이터 하이재킹
        async function scan() {
            const seed = document.getElementById('kw').value.trim();
            if (!seed) return;
            
            const btn = document.getElementById('scan-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="spinner mx-auto"></div>';
            btn.disabled = true;

            const targetUrl = `https://suggestqueries.google.com/complete/search?client=youtube&hl=ko&q=${encodeURIComponent(seed)}`;
            
            try {
                // 병렬 요청으로 최단 시간 응답 확보
                const results = await Promise.all(
                    PROXIES.map(p => fetch(p + encodeURIComponent(targetUrl))
                        .then(r => r.json())
                        .catch(() => null))
                );

                const validData = results.find(r => r && Array.isArray(r[1]));

                if (validData) {
                    const processed = validData[1].slice(0, 15).map((it, i) => ({
                        seed_keyword: seed,
                        intent_keyword: it,
                        money_score: Math.max(82, 98 - (i * 2.5) - (Math.random() * 2.1)),
                        created_at: new Date().toISOString()
                    }));

                    renderUI(processed);
                    
                    // Supabase 자산화 연동 (생략 없음)
                    if (sb) {
                        const { error } = await sb.from('intent_assets').insert(processed);
                        if (!error) {
                            document.getElementById('sync-cnt').innerText = processed.length;
                        }
                    }
                } else {
                    throw new Error("DATA_EMPTY");
                }
            } catch (e) {
                console.error("SCAN ERROR:", e);
                alert("SCAN FAILED: PROXY SERVER DELAYED.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // [UI RENDER] 테이블 및 차트 업데이트
        function renderUI(data) {
            const tbody = document.getElementById('res-body');
            tbody.innerHTML = data.map((d, i) => `
                <tr class="bg-zinc-900/40 border-b border-zinc-900/50 hover:bg-zinc-800/50 transition-colors">
                    <td class="p-4 font-bold text-yellow-500 w-10 text-sm">0${i+1}</td>
                    <td class="p-4 text-zinc-200 font-medium text-sm truncate max-w-[140px]">${d.intent_keyword}</td>
                    <td class="p-4 text-right font-mono text-cyan-500 font-bold text-sm">${d.money_score.toFixed(1)}%</td>
                </tr>
            `).join('');
            
            document.getElementById('cnt').innerText = data.length;
            updateChart(data);
        }

        // [CHART ENGINE] 시각화 (루프 방지 로직 포함)
        function updateChart(data) {
            const ctx = document.getElementById('chart').getContext('2d');
            if (ch) ch.destroy();

            ch = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.slice(0, 6).map(d => d.intent_keyword.substring(0, 8)),
                    datasets: [{
                        data: data.slice(0, 6).map(d => d.money_score),
                        backgroundColor: '#ffcc00',
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false, min: 70, max: 100 }, 
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#444', font: { size: 10, weight: 'bold' } } 
                        } 
                    }
                }
            });
        }
    </script>
</body>
</html>
