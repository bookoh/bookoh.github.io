<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; --card-bg: #111; --gray: #888; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: #fff; -webkit-font-smoothing: antialiased; }

        /* [1] 상단 히어로: 높이 40% 축소 및 텍스트 상단 배치 (얼굴 보호) */
        .hero-top {
            height: 40vh; /* 마스터 지시: 높이 절반으로 축소 */
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,1) 100%), 
                        url('jina-hero.jpg') no-repeat center 5%/cover; /* 이미지 위치 상단으로 조정하여 얼굴 보호 */
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; 
            text-align: center; padding-top: 50px; /* 텍스트를 최상단으로 밀어 올림 */
        }
        .brand-label { font-size: 0.9rem; color: var(--gold); letter-spacing: 5px; font-weight: 800; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .handle-top { font-size: 1.1rem; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
        .main-name { font-size: 4rem; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -2px; }
        .name-tag { border: 1px solid rgba(255,255,255,0.3); padding: 4px 15px; font-size: 0.85rem; color: #fff; margin-top: 15px; letter-spacing: 3px; }

        /* [2] 소셜 허브: 인스타그램 개인 계정 정밀 연결 (@ginawunseo) */
        .social-hub { padding: 35px 25px; background: #000; border-bottom: 1px solid #222; }
        .profile-header { max-width: 800px; margin: 0 auto; }
        .profile-header h2 { font-size: 1.8rem; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .verified { color: #1DA1F2; font-size: 0.9rem; }
        .bio-snippet { font-size: 1.05rem; color: #fff; margin: 15px 0; line-height: 1.6; font-weight: 400; }
        .tag-row { display: flex; gap: 12px; margin-top: 25px; }
        .social-tag {
            text-decoration: none; background: #1A1A1A; color: #ccc; padding: 10px 22px;
            border-radius: 40px; font-size: 0.95rem; border: 1px solid #333; font-weight: 600; transition: 0.3s;
        }
        .social-tag:hover { border-color: var(--gold); color: var(--gold); }

        /* [3] 유튜브 영상: 블랙 리퀴드 전환 (간격 제로) */
        .video-wrapper { background: #000; padding: 0; }
        .video-container { max-width: 1000px; margin: 0 auto; position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* [4] 스토리 섹션: 요청하신 3단 멘트 정밀 배치 */
        .quote-section { padding: 80px 25px; text-align: center; }
        .main-quote { font-size: 2.2rem; font-weight: 800; line-height: 1.5; letter-spacing: -1px; }
        .main-quote .line-1 { display: block; margin-bottom: 12px; }
        .main-quote .line-2 { display: block; margin-bottom: 12px; color: #fff; }
        .main-quote .line-3 { display: block; color: var(--gold); }

        /* [5] 경력 지표: 마스터가 선호하는 3열 카드 스타일 복구 */
        .stats-grid { 
            max-width: 900px; margin: 0 auto 100px; display: grid; 
            grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px;
        }
        .stat-card { background: var(--card-bg); padding: 45px 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .stat-card h3 { font-size: 2.8rem; color: var(--gold); margin: 0 0 10px 0; font-weight: 800; }
        .stat-card p { font-size: 1rem; color: #666; margin: 0; font-weight: 500; }

        .btn-footer {
            display: block; width: 240px; margin: 0 auto 120px; padding: 20px; 
            background: #FF0000; color: #fff; text-decoration: none; border-radius: 60px; 
            font-weight: 800; font-size: 1.2rem; text-align: center; transition: 0.3s;
        }
        .btn-footer:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(255,0,0,0.4); }

        @media (max-width: 768px) {
            .main-name { font-size: 3rem; }
            .main-quote { font-size: 1.7rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .hero-top { height: 45vh; padding-top: 40px; }
        }
    </style>
</head>
<body>

    <section class="hero-top">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle-top">@ginawunseo</div>
        <h1 class="main-name">지나운서</h1>
        <div class="name-tag">NOH JINA</div>
    </section>

    <section class="social-hub">
        <div class="profile-header">
            <h2>Noh Jina <span class="verified">●</span></h2>
            <div class="bio-snippet">
                사람탐험가 지나운서 | 인생2막 성장 기록 <br>
                대한청년일보 1호 기자 & 인터뷰어
            </div>
            <div class="tag-row">
                <a href="https://www.instagram.com/ginawunseo/" class="social-tag" target="_blank">인스타그램</a>
                <a href="https://youtube.com/@ginawunseo" class="social-tag" target="_blank">유튜브</a>
                <a href="https://www.threads.net/@ginawunseo" class="social-tag" target="_blank">스레드</a>
            </div>
        </div>
    </section>

    <section class="video-wrapper">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM" allowfullscreen></iframe>
        </div>
    </section>

    <section class="quote-section">
        <h2 class="main-quote">
            <span class="line-1">사람의 이야기를</span>
            <span class="line-2">기획하고</span>
            <span class="line-3">연결하는 탐험의 여정</span>
        </h2>
    </section>

    <div class="stats-grid">
        <div class="stat-card"><h3>1호</h3><p>대한청년일보 기자</p></div>
        <div class="stat-card"><h3>35+</h3><p>커뮤니티 모임 주최</p></div>
        <div class="stat-card"><h3>6회</h3><p>오프라인 대형 행사</p></div>
    </div>

    <a href="https://youtube.com/@ginawunseo" class="btn-footer" target="_blank">지나운서 채널 구독하기</a>

</body>
</html>
