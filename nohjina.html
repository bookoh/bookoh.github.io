<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; --card-bg: #0A0A0A; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: #fff; -webkit-font-smoothing: antialiased; }

        /* [1] 상단 히어로: 50% 분할 및 얼굴 보호 레이아웃 */
        .hero-top {
            height: 50vh; /* 정확히 화면 절반 */
            background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 100%), 
                        url('jina-hero.jpg') no-repeat center 10%/cover; /* 얼굴 안 가리게 상단 고정 */
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; 
            text-align: center; padding-top: 40px; /* 텍스트 상단 이동 */
        }
        .brand-label { font-size: 0.9rem; color: var(--gold); letter-spacing: 5px; font-weight: 800; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .handle-top { font-size: 1rem; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
        .main-name { font-size: 4.5rem; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -3px; }
        .name-tag { border: 1px solid var(--gold); padding: 3px 15px; font-size: 0.8rem; color: var(--gold); margin-top: 15px; letter-spacing: 4px; }

        /* [2] 소셜 허브: 인스타그램 개인 계정 정밀 연결 */
        .social-hub { padding: 30px 25px; background: #000; border-bottom: 1px solid #1a1a1a; }
        .profile-header { max-width: 800px; margin: 0 auto; }
        .profile-header h2 { font-size: 1.6rem; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 5px; }
        .verified { color: #1DA1F2; font-size: 0.8rem; }
        .bio-snippet { font-size: 1rem; color: #fff; margin: 12px 0; line-height: 1.5; }
        .tag-row { display: flex; gap: 10px; margin-top: 20px; }
        .social-tag {
            text-decoration: none; background: #111; color: #ccc; padding: 8px 20px;
            border-radius: 40px; font-size: 0.9rem; border: 1px solid #222; font-weight: 600; transition: 0.3s;
        }
        .social-tag:hover { border-color: var(--gold); color: var(--gold); }

        /* [3] 유튜브 영상: 밀착형 배치 */
        .video-wrapper { background: #000; padding: 0; }
        .video-container { max-width: 1000px; margin: 0 auto; position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* [4] 소개 멘트: 요청하신 3단 배치 적용 */
        .quote-section { padding: 80px 25px; text-align: center; }
        .main-quote { font-size: 2.3rem; font-weight: 800; line-height: 1.3; }
        .main-quote .line-1 { display: block; margin-bottom: 10px; }
        .main-quote .line-2 { display: block; margin-bottom: 10px; }
        .main-quote .line-3 { display: block; color: var(--gold); }

        /* [5] 경력 리스트: 세련된 카드형 슬림 디자인 */
        .career-list { max-width: 800px; margin: 0 auto; padding: 0 25px 100px; display: flex; flex-direction: column; gap: 15px; }
        .career-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 20px 25px; background: var(--card-bg); border-radius: 12px; border: 1px solid #1a1a1a;
        }
        .career-info h4 { font-size: 1.1rem; margin: 0; font-weight: 700; color: #fff; }
        .career-info p { font-size: 0.85rem; color: #555; margin: 3px 0 0 0; }
        .career-count { font-size: 1.5rem; font-weight: 900; color: var(--gold); }

        .btn-footer {
            display: block; width: 220px; margin: 0 auto 100px; padding: 18px; 
            background: #FF0000; color: #fff; text-decoration: none; border-radius: 50px; 
            font-weight: 800; font-size: 1.1rem; text-align: center;
        }

        @media (max-width: 768px) {
            .main-name { font-size: 3.5rem; }
            .main-quote { font-size: 1.8rem; }
            .hero-top { height: 45vh; }
        }
    </style>
</head>
<body>

    <section class="hero-top">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle-top">@ginawunseo</div>
        <h1 class="main-name">지나운서</h1>
        <div class="name-tag">NOH JINA</div>
    </section>

    <section class="social-hub">
        <div class="profile-header">
            <h2>Noh Jina <span class="verified">●</span></h2>
            <div class="bio-snippet">
                사람탐험가 지나운서 | 인생2막 성장 기록 <br>
                대한청년일보 1호 기자 & 인터뷰어
            </div>
            <div class="tag-row">
                <a href="https://www.instagram.com/ginawunseo/" class="social-tag" target="_blank">인스타그램</a>
                <a href="https://youtube.com/@ginawunseo" class="social-tag" target="_blank">유튜브</a>
                <a href="https://www.threads.net/@ginawunseo" class="social-tag" target="_blank">스레드</a>
            </div>
        </div>
    </section>

    <section class="video-wrapper">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM" allowfullscreen></iframe>
        </div>
    </section>

    <section class="quote-section">
        <h2 class="main-quote">
            <span class="line-1">"사람의 이야기를</span>
            <span class="line-2">기획하고</span>
            <span class="line-3">연결하는 탐험의 여정"</span>
        </h2>
    </section>

    <div class="career-list">
        <div class="career-item">
            <div class="career-info">
                <h4>대한청년일보 인터뷰어</h4>
                <p>공식 1호 기자로서의 기록과 탐색</p>
            </div>
            <div class="career-count">01</div>
        </div>
        <div class="career-item">
            <div class="career-info">
                <h4>커뮤니티 모임 주최</h4>
                <p>35회 이상의 미라클 굿모닝 정기 모임</p>
            </div>
            <div class="career-count">35+</div>
        </div>
        <div class="career-item">
            <div class="career-info">
                <h4>오프라인 대규모 행사</h4>
                <p>퇴사 파티 및 음악회 등 6회 기획</p>
            </div>
            <div class="career-count">06</div>
        </div>
    </div>

    <a href="https://youtube.com/@ginawunseo" class="btn-footer" target="_blank">유튜브 구독하기</a>

</body>
</html>
