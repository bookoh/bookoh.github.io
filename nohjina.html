<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; --white: #ffffff; --gray: #888; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: var(--white); -webkit-font-smoothing: antialiased; }

        /* 1. 최상단 히어로 섹션 (이미지 1000062601.jpg) */
        .hero {
            height: 80vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,1) 100%), url('1000062601.jpg') no-repeat center center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 0 20px;
        }
        
        /* 텍스트 위계 조정 */
        .brand-label { font-size: 1.1rem; color: var(--gold); letter-spacing: 5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .handle { font-size: 1.3rem; color: rgba(255,255,255,0.6); margin-bottom: 30px; font-weight: 300; }
        .main-name { font-size: 6rem; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -3px; }
        .sub-box { border: 1px solid rgba(255,255,255,0.3); padding: 5px 20px; font-size: 1rem; color: #fff; margin-top: 25px; letter-spacing: 3px; font-weight: 300; }

        /* 2. 유튜브 영상 섹션 (간격 최소화) */
        .video-section { background: #000; width: 100%; padding: 0; line-height: 0; }
        .video-container {
            max-width: 1200px; margin: 0 auto;
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 3. 본문 상세 내용 */
        .content { max-width: 900px; margin: 0 auto; padding: 80px 20px; text-align: center; }
        .heading { font-size: 2.8rem; font-weight: 800; line-height: 1.3; margin-bottom: 40px; }
        .heading span { color: var(--gold); }
        .description { font-size: 1.25rem; line-height: 2; color: var(--gray); margin-bottom: 70px; word-break: keep-all; }

        /* 경력 그리드 */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; }
        .card { background: #111; padding: 40px 20px; border-radius: 15px; border: 1px solid #222; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .card h3 { font-size: 2.5rem; color: var(--gold); margin: 0 0 10px 0; }
        .card p { font-size: 1rem; color: #666; margin: 0; }

        /* 버튼 */
        .btn-link {
            display: inline-block; padding: 20px 60px; background: #FF0000; color: #fff; 
            text-decoration: none; border-radius: 50px; font-weight: 800; font-size: 1.2rem; transition: 0.3s;
        }
        .btn-link:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(255,0,0,0.3); }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .main-name { font-size: 3.5rem; }
            .heading { font-size: 1.8rem; }
            .grid { grid-template-columns: 1fr; }
            .hero { height: 60vh; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle">@ginawunseo</div>
        <h1 class="main-name">지나운서</h1>
        <div class="sub-box">NOH JINA</div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM?rel=0" allowfullscreen></iframe>
        </div>
    </section>

    <section class="content">
        <h2 class="heading">"사람의 이야기를 기록하고 <br><span>연결하는 탐험</span>의 여정"</h2>
        <p class="description">
            막내 아이의 독립과 함께 시작된 인생 2막. <br>
            아나운서의 신뢰와 탐험가의 열정을 결합하여 <br>
            사람과 사람 사이의 진심을 기록하는 '사람탐험가'로 활동합니다.
        </p>

        <div class="grid">
            <div class="card">
                <h3>1호</h3>
                <p>대한청년일보 기자</p>
            </div>
            <div class="card">
                <h3>35+</h3>
                <p>커뮤니티 모임 주최</p>
            </div>
            <div class="card">
                <h3>6회</h3>
                <p>오프라인 대형 행사</p>
            </div>
        </div>

        <a href="https://youtube.com/@ginawunseo" class="btn-link" target="_blank">유튜브 채널 방문하기</a>
    </section>

</body>
</html>
