<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: #fff; -webkit-font-smoothing: antialiased; }

        /* 1. 최상단 히어로 이미지 섹션 (요청하신 이미지 반영) */
        .hero {
            height: 90vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,1) 100%), 
                        url('jina-hero.jpg') no-repeat center center/cover; /* 1000062601.jpg 파일명 */
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        
        /* 텍스트 사이즈 및 위계 정밀 조절 */
        .brand-label { font-size: 1.2rem; color: var(--gold); letter-spacing: 6px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        .handle { font-size: 1.4rem; color: rgba(255,255,255,0.7); margin-bottom: 40px; font-weight: 300; }
        .main-title { font-size: 7rem; font-weight: 900; margin: 0; line-height: 0.9; letter-spacing: -4px; }
        .name-tag { border: 1px solid rgba(255,255,255,0.4); padding: 6px 25px; font-size: 1.1rem; color: #fff; margin-top: 30px; letter-spacing: 4px; font-weight: 300; }

        /* 2. 유튜브 영상 섹션 (단차 제로화) */
        .video-section { background: #000; width: 100%; margin: 0; padding: 0; line-height: 0; }
        .video-container {
            max-width: 1280px; margin: 0 auto;
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 3. 상세 프로필 */
        .profile-body { max-width: 900px; margin: 0 auto; padding: 100px 20px; text-align: center; }
        .quote { font-size: 3rem; font-weight: 800; line-height: 1.4; margin-bottom: 50px; }
        .quote span { color: var(--gold); }
        .bio-text { font-size: 1.3rem; line-height: 2.1; color: #888; margin-bottom: 80px; word-break: keep-all; }

        /* 경력 지표 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 100px; }
        .stat-card { background: #111; padding: 45px 20px; border-radius: 20px; border: 1px solid #222; }
        .stat-card h3 { font-size: 2.8rem; color: var(--gold); margin: 0 0 10px 0; }
        .stat-card p { font-size: 1.1rem; color: #555; margin: 0; }

        .btn-action {
            display: inline-block; padding: 22px 70px; background: #FF0000; color: #fff; 
            text-decoration: none; border-radius: 60px; font-weight: 800; font-size: 1.4rem; transition: 0.3s;
        }
        .btn-action:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(255,0,0,0.4); }

        @media (max-width: 768px) {
            .main-title { font-size: 4rem; }
            .quote { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .hero { height: 75vh; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle">@ginawunseo</div>
        <h1 class="main-title">지나운서</h1>
        <div class="name-tag">NOH JINA</div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM" allowfullscreen></iframe>
        </div>
    </section>

    <section class="profile-body">
        <h2 class="quote">"사람의 이야기를 기록하고 <br><span>연결하는 탐험</span>의 여정"</h2>
        <p class="bio-text">
            막내 아이의 독립과 함께 시작된 인생 2막. <br>
            아나운서의 신뢰와 탐험가의 열정을 결합하여 <br>
            사람과 사람 사이의 진심을 기록하는 '사람탐험가'로 활동합니다.
        </p>

        <div class="stats-grid">
            <div class="stat-card"><h3>1호</h3><p>대한청년일보 기자</p></div>
            <div class="stat-card"><h3>35+</h3><p>커뮤니티 모임 주최</p></div>
            <div class="stat-card"><h3>6회</h3><p>오프라인 대형 행사</p></div>
        </div>

        <a href="https://youtube.com/@ginawunseo" class="btn-action" target="_blank">유튜브 채널 방문하기</a>
    </section>

</body>
</html>
