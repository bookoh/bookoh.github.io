<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; --card-bg: #0A0A0A; --gray: #777; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: #fff; -webkit-font-smoothing: antialiased; }

        /* [1] 상단 히어로: 이미지 화질 보정 및 텍스트 위치 최적화 */
        .hero-top {
            height: 55vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,1) 100%), 
                        url('jina-hero.jpg') no-repeat center 15%/cover; /* 얼굴 가리지 않게 위치 조정 */
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center; 
            text-align: center; padding-bottom: 30px;
        }
        /* 텍스트 선명도 강화 (Drop Shadow) */
        .brand-label { font-size: 0.95rem; color: var(--gold); letter-spacing: 6px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        .handle-top { font-size: 1.1rem; color: rgba(255,255,255,0.8); margin-bottom: 15px; text-shadow: 0 2px 5px rgba(0,0,0,1); }
        .main-name { font-size: clamp(3.5rem, 8vw, 5.5rem); font-weight: 900; margin: 0; line-height: 1; letter-spacing: -2px; text-shadow: 0 5px 20px rgba(0,0,0,1); }
        .name-tag { border: 1.5px solid var(--gold); padding: 4px 18px; font-size: 0.85rem; color: var(--gold); margin-top: 20px; letter-spacing: 4px; font-weight: 500; }

        /* [2] 소셜 허브: 스레드 UI 정밀 구현 */
        .social-hub { padding: 40px 25px; background: var(--dark); border-bottom: 1px solid #1a1a1a; }
        .profile-header { max-width: 800px; margin: 0 auto; position: relative; }
        .profile-text h2 { font-size: 1.8rem; margin: 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .verified { color: #1DA1F2; font-size: 0.9rem; }
        .bio-snippet { font-size: 1.05rem; color: #fff; margin: 15px 0; line-height: 1.6; }
        .tag-row { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }
        .social-tag {
            text-decoration: none; background: #111; color: #eee; padding: 10px 22px;
            border-radius: 40px; font-size: 0.95rem; border: 1px solid #222; font-weight: 600; transition: 0.3s;
        }
        .social-tag:hover { border-color: var(--gold); color: var(--gold); background: #1a1a1a; }

        /* [3] 유튜브 영상: 블랙 리퀴드 전환 */
        .video-wrapper { background: #000; padding: 0; }
        .video-container { max-width: 1000px; margin: 0 auto; position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* [4] 경력 및 스토리: 아마추어 느낌 제거 (세련된 리스트형) */
        .career-section { max-width: 800px; margin: 0 auto; padding: 80px 25px; }
        .section-title { font-size: 2.2rem; font-weight: 800; text-align: center; margin-bottom: 60px; line-height: 1.4; }
        .section-title span { color: var(--gold); }
        
        .career-list { display: flex; flex-direction: column; gap: 20px; }
        .career-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 25px; background: var(--card-bg); border-radius: 15px; border-left: 4px solid var(--gold);
        }
        .career-info h4 { font-size: 1.3rem; margin: 0; font-weight: 700; color: #fff; }
        .career-info p { font-size: 0.95rem; color: var(--gray); margin: 5px 0 0 0; }
        .career-count { font-size: 1.8rem; font-weight: 900; color: var(--gold); }

        .footer-cta { text-align: center; padding: 100px 0; border-top: 1px solid #1a1a1a; }
        .btn-visit {
            display: inline-block; padding: 18px 50px; background: #FF0000; color: #fff; 
            text-decoration: none; border-radius: 50px; font-weight: 800; font-size: 1.1rem; transition: 0.4s;
        }

        @media (max-width: 768px) {
            .main-name { font-size: 3.2rem; }
            .career-item { padding: 20px; }
            .career-count { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <section class="hero-top">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle-top">@ginawunseo</div>
        <h1 class="main-name">지나운서</h1>
        <div class="name-tag">NOH JINA</div>
    </section>

    <section class="social-hub">
        <div class="profile-header">
            <div class="profile-text">
                <h2>Noh Jina <span class="verified">●</span></h2>
                <div class="bio-snippet">
                    사람탐험가 지나운서 | 인생2막 성장 기록 <br>
                    대한청년일보 1호 기자 & 인터뷰어
                </div>
                <div class="tag-row">
                    <a href="https://www.instagram.com/ginawunseo/" class="social-tag" target="_blank">인스타그램</a>
                    <a href="https://youtube.com/@ginawunseo" class="social-tag" target="_blank">유튜브</a>
                    <a href="https://www.threads.net/@ginawunseo" class="social-tag" target="_blank">스레드</a>
                </div>
            </div>
        </div>
    </section>

    <section class="video-wrapper">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM" allowfullscreen></iframe>
        </div>
    </section>

    <section class="career-section">
        <h2 class="section-title">사람의 이야기를 기록하고 <br><span>연결하는 탐험</span>의 여정</h2>
        
        <div class="career-list">
            <div class="career-item">
                <div class="career-info">
                    <h4>대한청년일보 인터뷰어</h4>
                    <p>공식 1호 기자로서의 기록과 탐색</p>
                </div>
                <div class="career-count">01</div>
            </div>
            <div class="career-item">
                <div class="career-info">
                    <h4>커뮤니티 모임 주최</h4>
                    <p>미라클 굿모닝 리더 및 35회 이상의 정기 모임</p>
                </div>
                <div class="career-count">35+</div>
            </div>
            <div class="career-item">
                <div class="career-info">
                    <h4>오프라인 대규모 행사</h4>
                    <p>퇴사 파티, 음악회 등 6회 이상의 기획 및 진행</p>
                </div>
                <div class="career-count">06</div>
            </div>
        </div>
    </section>

    <footer class="footer-cta">
        <a href="https://youtube.com/@ginawunseo" class="btn-visit" target="_blank">지나운서 채널 구독하기</a>
    </footer>

</body>
</html>
