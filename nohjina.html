<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSBKTV | 지나운서 노지나</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --gold: #C5A059; --dark: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background: var(--dark); color: #fff; -webkit-font-smoothing: antialiased; }

        /* [PART 1] 상단 히어로 (이미지 구역 - 사이즈 최적화) */
        .hero-top {
            height: 50vh; /* 전체 화면의 절반만 차지 */
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%), 
                        url('jina-hero.jpg') no-repeat center 20%/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .brand-label { font-size: 1rem; color: var(--gold); letter-spacing: 5px; font-weight: 800; margin-bottom: 5px; }
        .handle-top { font-size: 1.1rem; color: rgba(255,255,255,0.6); margin-bottom: 15px; }
        .main-name { font-size: 5rem; font-weight: 900; margin: 0; line-height: 0.9; letter-spacing: -3px; }
        .name-tag { border: 1px solid rgba(255,255,255,0.3); padding: 4px 15px; font-size: 0.9rem; color: #fff; margin-top: 15px; letter-spacing: 3px; }

        /* [PART 2] 소셜 허브 (스레드 스타일 레이아웃) */
        .social-hub {
            padding: 40px 30px; background: #000; border-bottom: 1px solid #222;
        }
        .profile-header { max-width: 900px; margin: 0 auto; }
        .profile-text h2 { font-size: 2rem; margin: 0; font-weight: 800; }
        .profile-text p { font-size: 1rem; color: #aaa; margin: 10px 0; line-height: 1.6; }
        .tag-container { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .social-tag {
            text-decoration: none; background: #1A1A1A; color: #ccc; padding: 8px 20px;
            border-radius: 30px; font-size: 0.9rem; border: 1px solid #333; transition: 0.3s;
        }
        .social-tag:hover { border-color: var(--gold); color: var(--gold); }

        /* [PART 3] 유튜브 영상 (이전 디자인 그대로 적용) */
        .video-section { background: #000; width: 100%; padding: 0; line-height: 0; }
        .video-container {
            max-width: 1200px; margin: 0 auto;
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* [PART 4] 상세 프로필 및 경력 (이전 디자인 유지) */
        .profile-body { max-width: 900px; margin: 0 auto; padding: 80px 20px; text-align: center; }
        .quote { font-size: 2.5rem; font-weight: 800; line-height: 1.4; margin-bottom: 40px; }
        .quote span { color: var(--gold); }
        .bio-text { font-size: 1.2rem; line-height: 2; color: #888; margin-bottom: 60px; word-break: keep-all; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; }
        .stat-card { background: #111; padding: 40px 15px; border-radius: 20px; border: 1px solid #222; }
        .stat-card h3 { font-size: 2.5rem; color: var(--gold); margin: 0 0 10px 0; }
        .stat-card p { font-size: 1rem; color: #555; margin: 0; }

        .btn-action {
            display: inline-block; padding: 20px 60px; background: #FF0000; color: #fff; 
            text-decoration: none; border-radius: 50px; font-weight: 800; font-size: 1.2rem; transition: 0.3s;
        }
        .btn-action:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(255,0,0,0.3); }

        @media (max-width: 768px) {
            .main-name { font-size: 3.5rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .hero-top { height: 40vh; }
        }
    </style>
</head>
<body>

    <section class="hero-top">
        <div class="brand-label">BSBKTV ANNOUNCER</div>
        <div class="handle-top">@ginawunseo</div>
        <h1 class="main-name">지나운서</h1>
        <div class="name-tag">NOH JINA</div>
    </section>

    <section class="social-hub">
        <div class="profile-header">
            <div class="profile-text">
                <h2>Noh Jina <span style="color:#1DA1F2; font-size: 1rem;">●</span></h2>
                <p>👤 사람탐험가 지나운서 | 인생2막 성장 기록<br>
                   📝 대한청년일보 1호 기자 | 인터뷰어</p>
                <div class="tag-container">
                    <a href="https://www.instagram.com/ginawunseo?igsh=MTFwYTd0bnJ4c2t0Nw==" class="social-tag" target="_blank">인스타그램</a>
                    <a href="https://youtube.com/@ginawunseo?si=vTqu_p6fS5S2AP9r" class="social-tag" target="_blank">유튜브</a>
                    <a href="https://www.threads.net/@ginawunseo" class="social-tag" target="_blank">스레드</a>
                </div>
            </div>
        </div>
    </section>

    <section class="video-section">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/xiBRcq_FoRM" allowfullscreen></iframe>
        </div>
    </section>

    <section class="profile-body">
        <h2 class="quote">"사람의 이야기를 기록하고 <br><span>연결하는 탐험</span>의 여정"</h2>
        <p class="bio-text">
            막내 아이의 독립과 함께 시작된 인생 2막. <br>
            아나운서의 신뢰와 탐험가의 열정을 결합하여 <br>
            사람과 사람 사이의 진심을 기록하는 '사람탐험가'로 활동합니다.
        </p>

        <div class="stats-grid">
            <div class="stat-card"><h3>1호</h3><p>대한청년일보 기자</p></div>
            <div class="stat-card"><h3>35+</h3><p>커뮤니티 모임 주최</p></div>
            <div class="stat-card"><h3>6회</h3><p>오프라인 대형 행사</p></div>
        </div>

        <a href="https://youtube.com/@ginawunseo" class="btn-action" target="_blank">유튜브 채널 방문하기</a>
    </section>

</body>
</html>
