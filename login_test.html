<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 격리 테스트</title>
    <style>
        body { padding: 50px; font-family: sans-serif; }
        .box { border: 2px solid #ddd; padding: 20px; border-radius: 10px; max-width: 400px; }
        .status { font-weight: bold; margin-bottom: 20px; padding: 10px; border-radius: 5px; }
        .logged-in { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .logged-out { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🔍 로그인 유지 테스트</h2>
        
        <div id="status-box" class="status logged-out">상태 확인 중...</div>
        
        <div id="controls">
            <input type="email" id="email" placeholder="이메일" style="padding:5px;">
            <input type="password" id="pw" placeholder="비밀번호" style="padding:5px;">
            <br><br>
            <button id="login-btn">로그인 테스트</button>
            <button id="logout-btn" style="display:none;">로그아웃</button>
        </div>

        <p>※ 로그인 후 <b>새로고침(F5)</b>을 해보세요.<br>초록색이 유지되면 성공입니다.</p>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        // 선생님의 키 정보 그대로 적용
        const supabase = createClient(
            "https://dmjaxhydwaumhujrculd.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MTEyNTgsImV4cCI6MjA4MDI4NzI1OH0.nTdfW9Iw3OLyYbWcPGU2T8P_i-9tDeqUn1t2cAsIbn0",
            {
                auth: {
                    storage: localStorage, // 핵심: 로컬스토리지 강제 지정
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            }
        );

        const els = {
            status: document.getElementById('status-box'),
            loginBtn: document.getElementById('login-btn'),
            logoutBtn: document.getElementById('logout-btn'),
            email: document.getElementById('email'),
            pw: document.getElementById('pw')
        };

        // 1. 상태 감지 및 UI 업데이트
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                els.status.className = 'status logged-in';
                els.status.innerHTML = `✅ <b>로그인 됨</b><br>${session.user.email}`;
                els.logoutBtn.style.display = 'inline-block';
                els.loginBtn.style.display = 'none';
            } else {
                els.status.className = 'status logged-out';
                els.status.textContent = '❌ 로그아웃 상태';
                els.logoutBtn.style.display = 'none';
                els.loginBtn.style.display = 'inline-block';
            }
        }

        // 2. 로그인 버튼
        els.loginBtn.onclick = async () => {
            const email = els.email.value;
            const password = els.pw.value;
            if(!email || !password) return alert('정보를 입력하세요');

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert('로그인 실패: ' + error.message);
            else checkUser(); // 성공 시 즉시 갱신
        };

        // 3. 로그아웃 버튼
        els.logoutBtn.onclick = async () => {
            await supabase.auth.signOut();
            localStorage.clear();
            checkUser(); // 즉시 갱신
        };

        // 시작 시 체크
        checkUser();

    </script>
</body>
</html>
