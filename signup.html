<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>BSBKTV · 로그인 및 회원가입</title>

    <style>
      /* --- [Original CSS Preserved] --- */
      body {
        background: #000;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Pretendard",
          sans-serif;
      }

      .signup-form {
        max-width: 400px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      .signup-form h1 {
        font-size: 24px;
        margin-bottom: 6px;
      }

      .signup-form .subtitle {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 24px;
      }

      .signup-form label {
        display: block;
        font-size: 13px;
        margin-bottom: 16px;
      }

      .signup-form input[type="email"],
      .signup-form input[type="password"] {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #111;
        color: #eee;
      }

      .signup-form input:focus {
        outline: none;
        border-color: #9f7aea;
        box-shadow: 0 0 0 1px #9f7aea55;
      }

      .terms {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12px;
      }

      .terms input {
        margin-top: 3px;
      }

      .btn-primary {
        width: 100%;
        margin-top: 8px;
        padding: 12px 0;
        border-radius: 999px;
        border: none;
        background: #9f7aea;
        color: #000;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary:hover {
        background: #b794f4;
      }

      .signup-form .meta {
        margin-top: 16px;
        font-size: 13px;
        color: #999;
      }

      .signup-form .meta a {
        color: #9f7aea;
        cursor: pointer;
        text-decoration: underline;
      }

      /* --- [Added CSS for Google Button & Utility] --- */
      .hidden {
        display: none !important;
      }
      
      /* 스크린샷과 유사한 구글 로그인 버튼 스타일 추가 */
      .btn-google {
        width: 100%;
        margin-top: 12px;
        padding: 12px 0;
        border-radius: 999px;
        border: none;
        background: #ffffff;
        color: #000;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-google:hover {
        background: #f1f1f1;
      }
      /* 구분선 스타일 */
      .divider {
        display: flex;
        align-items: center;
        color: #555;
        font-size: 12px;
        margin: 20px 0;
      }
      .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #333;
      }
      .divider span {
        padding: 0 10px;
      }
    </style>
  </head>

  <body>
    <form class="signup-form" id="auth-form">
      <h1 id="form-title">BSBKTV 가입</h1>
      <p class="subtitle">AI 오디오북 · 영상 책방을 한 번에.</p>

      <label>
        이메일
        <input type="email" name="email" id="email" required autocomplete="email" />
      </label>

      <label>
        비밀번호
        <input
          type="password"
          name="password"
          id="password"
          required
          minlength="8"
          autocomplete="current-password"
        />
      </label>

      <label class="terms" id="terms-area">
        <input type="checkbox" name="terms" id="terms" required />
        <span>서비스 이용약관 및 개인정보 처리방침에 동의합니다.</span>
      </label>

      <button type="submit" class="btn-primary" id="submit-btn">간편 회원가입</button>

      <p class="meta">
        <span id="meta-text">이미 계정이 있나요?</span>
        <a id="toggle-mode">로그인</a>
      </p>

      <div class="divider">
        <span>또는</span>
      </div>
      
      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.348409 6.17318 0 7.54773 0 9C0 10.4523 0.348409 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
        </svg>
        Google로 로그인
      </button>
    </form>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // [Supabase Configuration]
      const supabaseUrl = "https://dmjaxhydwaumhujrculd.supabase.co"; 
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MTEyNTgsImV4cCI6MjA4MDI4NzI1OH0.nTdfW9Iw3OLyYbWcPGU2T8P_i-9tDeqUn1t2cAsIbn0";

      const supabase = createClient(supabaseUrl, supabaseKey);

      // DOM Elements
      const form = document.getElementById("auth-form");
      const formTitle = document.getElementById("form-title");
      const submitBtn = document.getElementById("submit-btn");
      const termsArea = document.getElementById("terms-area");
      const termsInput = document.getElementById("terms");
      const metaText = document.getElementById("meta-text");
      const toggleModeBtn = document.getElementById("toggle-mode");
      const googleBtn = document.getElementById("google-btn");

      let isSignupMode = true;

      // 1. [핵심] 로그인 유지 및 상태 변경 감지 (Persistence Fix)
      // 페이지 로드 시 또는 로그인 상태 변경 시 실행됨
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          // 세션이 존재하면(로그인 됨) 메인 페이지로 이동
          console.log("사용자 인증됨:", session.user.email);
          // 알림 후 이동 (UX를 위해 짧은 딜레이 줄 수도 있음)
          // alert("로그인 상태입니다. 메인으로 이동합니다."); 
          window.location.href = "/"; 
        }
      });

      // 2. [Google 로그인] 실제 작동 로직 추가
      googleBtn.addEventListener("click", async () => {
        try {
          const { data, error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin, // 로그인 후 돌아올 주소
            },
          });
          if (error) throw error;
          // 구글 로그인은 리다이렉트 되므로 여기서 추가 동작 불필요
        } catch (error) {
          alert("Google 로그인 오류: " + error.message);
        }
      });

      // 3. 모드 전환 (로그인 <-> 회원가입)
      toggleModeBtn.addEventListener("click", () => {
        isSignupMode = !isSignupMode;

        if (isSignupMode) {
          formTitle.textContent = "BSBKTV 가입";
          submitBtn.textContent = "간편 회원가입";
          termsArea.classList.remove("hidden");
          termsInput.required = true;
          metaText.textContent = "이미 계정이 있나요?";
          toggleModeBtn.textContent = "로그인";
        } else {
          formTitle.textContent = "BSBKTV 로그인";
          submitBtn.textContent = "로그인";
          termsArea.classList.add("hidden");
          termsInput.required = false;
          metaText.textContent = "계정이 없으신가요?";
          toggleModeBtn.textContent = "회원가입";
        }
      });

      // 4. 이메일 폼 제출 처리
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const originalBtnText = submitBtn.textContent;
        submitBtn.textContent = "처리 중...";
        submitBtn.disabled = true;

        try {
          if (isSignupMode) {
            // 회원가입
            if (!termsInput.checked) {
              alert("약관에 동의해야 가입할 수 있습니다.");
              return;
            }
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            alert("가입 완료! 이메일 인증 링크를 확인해주세요.");
            form.reset();
          } else {
            // 로그인
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            // 성공 시 onAuthStateChange가 감지하여 리다이렉트 처리함
          }
        } catch (error) {
          alert("오류: " + error.message);
        } finally {
          submitBtn.textContent = originalBtnText;
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
