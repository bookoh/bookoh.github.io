<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>BSBKTV · 로그인 및 회원가입</title>

    <style>
      /* --- [Original CSS 유지] --- */
      body {
        background: #000;
        color: #eee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Pretendard",
          sans-serif;
      }

      .signup-form {
        max-width: 400px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      .signup-form h1 {
        font-size: 24px;
        margin-bottom: 6px;
      }

      .signup-form .subtitle {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 24px;
      }

      .signup-form label {
        display: block;
        font-size: 13px;
        margin-bottom: 16px;
      }

      .signup-form input[type="email"],
      .signup-form input[type="password"] {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #333;
        background: #111;
        color: #eee;
      }

      .signup-form input:focus {
        outline: none;
        border-color: #9f7aea;
        box-shadow: 0 0 0 1px #9f7aea55;
      }

      .terms {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 12px;
      }

      .terms input {
        margin-top: 3px;
      }

      .btn-primary {
        width: 100%;
        margin-top: 8px;
        padding: 12px 0;
        border-radius: 999px;
        border: none;
        background: #9f7aea;
        color: #000;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary:hover {
        background: #b794f4;
      }

      .signup-form .meta {
        margin-top: 16px;
        font-size: 13px;
        color: #999;
      }

      .signup-form .meta a {
        color: #9f7aea;
        cursor: pointer; /* 클릭 가능하도록 커서 변경 */
        text-decoration: underline;
      }

      /* --- [기능 추가를 위한 유틸리티 클래스] --- */
      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <form class="signup-form" id="auth-form">
      <h1 id="form-title">BSBKTV 가입</h1>
      <p class="subtitle">AI 오디오북 · 영상 책방을 한 번에.</p>

      <label>
        이메일
        <input type="email" name="email" id="email" required autocomplete="email" />
      </label>

      <label>
        비밀번호
        <input
          type="password"
          name="password"
          id="password"
          required
          minlength="8"
          autocomplete="current-password"
        />
      </label>

      <label class="terms" id="terms-area">
        <input type="checkbox" name="terms" id="terms" required />
        <span>서비스 이용약관 및 개인정보 처리방침에 동의합니다.</span>
      </label>

      <button type="submit" class="btn-primary" id="submit-btn">간편 회원가입</button>

      <p class="meta">
        <span id="meta-text">이미 계정이 있나요?</span>
        <a id="toggle-mode">로그인</a>
      </p>
    </form>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // 제공해주신 Supabase 키값 그대로 적용
      const supabaseUrl = "https://dmjaxhydwaumhujrculd.supabase.co"; 
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtamF4aHlkd2F1bWh1anJjdWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MTEyNTgsImV4cCI6MjA4MDI4NzI1OH0.nTdfW9Iw3OLyYbWcPGU2T8P_i-9tDeqUn1t2cAsIbn0";

      const supabase = createClient(supabaseUrl, supabaseKey);

      // DOM 요소 선택
      const form = document.getElementById("auth-form");
      const formTitle = document.getElementById("form-title");
      const submitBtn = document.getElementById("submit-btn");
      const termsArea = document.getElementById("terms-area");
      const termsInput = document.getElementById("terms");
      const metaText = document.getElementById("meta-text");
      const toggleModeBtn = document.getElementById("toggle-mode");

      // 현재 모드 상태 (true: 회원가입, false: 로그인)
      let isSignupMode = true;

      // 1. [모드 전환 기능] 로그인 <-> 회원가입 토글
      toggleModeBtn.addEventListener("click", () => {
        isSignupMode = !isSignupMode; // 상태 반전

        if (isSignupMode) {
          // -> 회원가입 모드로 전환
          formTitle.textContent = "BSBKTV 가입";
          submitBtn.textContent = "간편 회원가입";
          termsArea.classList.remove("hidden"); // 약관 보이기
          termsInput.required = true;           // 약관 필수 체크
          metaText.textContent = "이미 계정이 있나요?";
          toggleModeBtn.textContent = "로그인";
        } else {
          // -> 로그인 모드로 전환
          formTitle.textContent = "BSBKTV 로그인";
          submitBtn.textContent = "로그인";
          termsArea.classList.add("hidden");    // 약관 숨기기
          termsInput.required = false;          // 약관 체크 불필요
          metaText.textContent = "계정이 없으신가요?";
          toggleModeBtn.textContent = "회원가입";
        }
      });

      // 2. [폼 제출 처리]
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // 버튼 로딩 상태
        const originalBtnText = submitBtn.textContent;
        submitBtn.textContent = "처리 중...";
        submitBtn.disabled = true;

        try {
          if (isSignupMode) {
            // --- [회원가입 로직] ---
            if (!termsInput.checked) {
              alert("약관에 동의해야 가입할 수 있습니다.");
              return; // finally 블록으로 이동
            }

            const { data, error } = await supabase.auth.signUp({
              email,
              password,
            });

            if (error) throw error;

            alert("가입 완료! 이메일로 전송된 인증 링크를 확인해 주세요.");
            form.reset(); // 폼 초기화

          } else {
            // --- [로그인 로직] ---
            const { data, error } = await supabase.auth.signInWithPassword({
              email,
              password,
            });

            if (error) throw error;

            // 로그인 성공 시
            alert("로그인 되었습니다.");
            // 메인 페이지로 이동 (필요시 경로 수정)
            window.location.href = "/"; 
          }
        } catch (error) {
          alert("오류 발생: " + error.message);
        } finally {
          // 버튼 상태 복구
          submitBtn.textContent = originalBtnText;
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
